<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
  <title>极简 · 主页</title>
  <!-- 极简风格，无额外库，纯原生 -->
  <style>
    /* 全局重置 & 极简基调 */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: #faf9f8;   /* 柔白底色 */
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
      line-height: 1.5;
      color: #1e1e1e;
    }

    /* 卡片式极简容器 — 干净、留白、呼吸感 */
    .home {
      max-width: 680px;
      width: 100%;
      background: #ffffff;
      border-radius: 2.5rem;
      padding: 3rem 2.5rem;
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.03), 0 4px 8px rgba(0, 0, 0, 0.02);
      transition: box-shadow 0.2s ease;
      text-align: center;
    }

    /* 随机生成的主视觉 — 柔和渐变 + 几何点缀 */
    .visual {
      width: 100%;
      height: 120px;
      background: linear-gradient(135deg, #f0ebe3 0%, #e6dfd7 100%);
      border-radius: 2rem;
      margin-bottom: 2.2rem;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      overflow: hidden;
    }

    /* 随机抽象图形 (纯CSS, 每次刷新不同) */
    .visual-shape {
      width: 80px;
      height: 80px;
      background: rgba(255, 255, 255, 0.5);
      backdrop-filter: blur(2px);
      border-radius: 40% 60% 70% 30% / 50% 40% 60% 50%;
      box-shadow: 0 8px 20px rgba(0,0,0,0.02);
      transition: all 0.3s;
      /* 随机形状由内联 style 生成，这里仅保留基础 */
    }

    /* 标题 — 极轻且有力 */
    .greeting {
      font-size: 2.2rem;
      font-weight: 360;
      letter-spacing: -0.02em;
      margin-bottom: 0.4rem;
      color: #1e1e1e;
    }

    .greeting span {
      font-weight: 480;
      background: linear-gradient(145deg, #3d3d3d, #1a1a1a);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .subhead {
      font-size: 1rem;
      font-weight: 360;
      color: #6b6b6b;
      margin-top: 0.2rem;
      margin-bottom: 2rem;
      letter-spacing: 0.02em;
      border-bottom: 1px solid #f0eeeb;
      padding-bottom: 1.8rem;
    }

    /* 随机功能卡片 — 极简网格 */
    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1rem;
      margin-top: 0.4rem;
    }

    .card {
      background: #f8f7f5;
      border-radius: 1.8rem;
      padding: 1.6rem 0.8rem;
      transition: background 0.15s ease, transform 0.1s ease;
      cursor: default;
      border: 1px solid #f0eee9;
      box-shadow: 0 1px 2px rgba(0,0,0,0.01);
    }

    .card:hover {
      background: #f3f1ed;
      border-color: #e3dfd8;
    }

    .card-icon {
      font-size: 2rem;
      line-height: 1.2;
      margin-bottom: 0.2rem;
      display: block;
    }

    .card-title {
      font-weight: 450;
      font-size: 1rem;
      color: #1e1e1e;
      letter-spacing: -0.01em;
    }

    .card-desc {
      font-size: 0.78rem;
      color: #7a7a7a;
      margin-top: 0.2rem;
      font-weight: 350;
      letter-spacing: 0.01em;
    }

    /* 随机小标签 — 随性 */
    .random-tag {
      margin-top: 2.4rem;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: center;
      gap: 0.5rem 0.8rem;
      font-size: 0.75rem;
      color: #8a8a8a;
      border-top: 1px solid #f0eeeb;
      padding-top: 2rem;
    }

    .random-tag span {
      background: #f4f2ef;
      padding: 0.2rem 0.9rem;
      border-radius: 40px;
      letter-spacing: 0.02em;
      color: #4d4d4d;
      border: 1px solid #eae7e2;
      font-weight: 350;
    }

    .random-tag .emoji-badge {
      background: transparent;
      border: none;
      padding: 0 0.1rem;
      font-size: 1rem;
    }

    /* 极简footer */
    .footer-note {
      margin-top: 2.2rem;
      font-size: 0.7rem;
      color: #b0b0b0;
      letter-spacing: 0.04em;
      font-weight: 300;
    }

    .footer-note a {
      color: #8a8a8a;
      text-decoration: none;
      border-bottom: 1px dotted #d6d6d6;
    }

    .footer-note a:hover {
      color: #3a3a3a;
      border-bottom-color: #888;
    }

    /* 移动端适配 */
    @media (max-width: 500px) {
      .home {
        padding: 2rem 1.2rem;
        border-radius: 2rem;
      }
      .greeting {
        font-size: 1.8rem;
      }
      .grid {
        grid-template-columns: 1fr 1fr;
        gap: 0.8rem;
      }
      .card {
        padding: 1.2rem 0.4rem;
      }
      .visual {
        height: 90px;
      }
      .visual-shape {
        width: 60px;
        height: 60px;
      }
    }

    @media (max-width: 380px) {
      .grid {
        grid-template-columns: 1fr;
        gap: 0.7rem;
      }
      .card {
        padding: 0.9rem;
      }
      .random-tag {
        flex-direction: column;
        gap: 0.3rem;
      }
    }
  </style>
</head>
<body>
  <div class="home">

    <!-- 随机视觉区：每次刷新形状/颜色微变 (通过内联style随机) -->
    <div class="visual" id="visualBox">
      <div class="visual-shape" id="shapeEl"></div>
    </div>

    <!-- 主问候 + 随机名称 (动态) -->
    <h1 class="greeting">
      <span id="greetingText">你好，</span> 
      <span id="nameDisplay">探索者</span>
    </h1>
    <p class="subhead" id="subheadLine">· 今日随机 · 保持轻盈 ·</p>

    <!-- 功能卡片 (随机内容) -->
    <div class="grid" id="cardGrid">
      <!-- 卡片由 js 动态生成，保证每次刷新不同 -->
    </div>

    <!-- 随机标签云 (随机生成) -->
    <div class="random-tag" id="tagContainer">
      <!-- js 填充 -->
    </div>

    <!-- 极简脚注 -->
    <div class="footer-note">
      <span id="footerText">✦ 随机刷新 · 极简主页 ✦</span>
    </div>
  </div>

  <script>
    (function() {
      "use strict";

      // ----- 随机工具 -----
      const random = (min, max) => Math.floor(Math.random() * (max - min + 1)) + min;
      const pick = (arr) => arr[Math.floor(Math.random() * arr.length)];

      // ----- 1. 随机渐变 & 形状 (视觉区) -----
      const visualBox = document.getElementById('visualBox');
      const shapeEl = document.getElementById('shapeEl');

      // 随机柔和渐变 (保留极简调性)
      const gradients = [
        'linear-gradient(135deg, #f0ebe3 0%, #e6dfd7 100%)',
        'linear-gradient(145deg, #ece7e0 0%, #dbd4cb 100%)',
        'linear-gradient(120deg, #f3efe8 0%, #e3dbd1 100%)',
        'linear-gradient(160deg, #eae4dc 0%, #dcd5cc 100%)',
        'linear-gradient(140deg, #f5f0e9 0%, #e2dad0 100%)',
        'linear-gradient(125deg, #efeae2 0%, #d9d1c7 100%)'
      ];
      visualBox.style.background = pick(gradients);

      // 随机形状 (border-radius 变形)
      const r1 = random(30, 70);
      const r2 = random(40, 80);
      const r3 = random(20, 60);
      const r4 = random(30, 70);
      const r5 = random(40, 80);
      const r6 = random(30, 70);
      const r7 = random(20, 60);
      const r8 = random(40, 80);
      shapeEl.style.borderRadius = `${r1}% ${r2}% ${r3}% ${r4}% / ${r5}% ${r6}% ${r7}% ${r8}%`;
      // 随机尺寸微调
      const size = random(60, 90);
      shapeEl.style.width = size + 'px';
      shapeEl.style.height = size + 'px';
      // 随机背景微变 (半透明叠加)
      const hue = random(20, 50);
      shapeEl.style.background = `hsla(${hue}, 15%, 85%, 0.5)`;
      shapeEl.style.backdropFilter = 'blur(3px)';

      // ----- 2. 随机问候 & 名字 -----
      const greetings = ['你好', 'Hey', 'Hi', 'Bonjour', 'Hola', 'Ciao', 'こんにちは', '👋'];
      const names = ['探索者', '漫步者', '小宇宙', '路人甲', '梦想家', '观察者', '旅人', '星尘', '🌱', '🌊', '☀️', '🍃'];
      document.getElementById('greetingText').textContent = pick(greetings) + ',';
      document.getElementById('nameDisplay').textContent = pick(names);

      // 随机副标题
      const subLines = [
        '· 今日随机 · 保持轻盈 ·',
        '· 极简 · 留白 · 呼吸 ·',
        '· 此刻 · 随性 · 自由 ·',
        '· 少即是多 · 慢即是快 ·',
        '· 静观 · 内省 · 平和 ·',
        '· 简洁 · 纯粹 · 本真 ·'
      ];
      document.getElementById('subheadLine').textContent = pick(subLines);

      // ----- 3. 随机卡片 (4张) -----
      const cardPool = [
        { icon: '📌', title: '笔记', desc: '随手记录灵感' },
        { icon: '🧘', title: '冥想', desc: '片刻宁静' },
        { icon: '📖', title: '阅读', desc: '今日书页' },
        { icon: '🎵', title: '声景', desc: '随机旋律' },
        { icon: '☕', title: '咖啡', desc: '慢冲一杯' },
        { icon: '🌿', title: '自然', desc: '草木气息' },
        { icon: '✨', title: '星尘', desc: '宇宙碎片' },
        { icon: '📷', title: '光影', desc: '瞬间定格' },
        { icon: '🧩', title: '拼图', desc: '碎片重组' },
        { icon: '🎨', title: '涂鸦', desc: '随意线条' },
        { icon: '📦', title: '收纳', desc: '整理思绪' },
        { icon: '🕯️', title: '烛光', desc: '温暖片刻' }
      ];

      // 随机选4张不重复 (若池子不够则允许重复, 但池子有12个, 足够)
      function pickCards(arr, n) {
        const shuffled = [...arr];
        for (let i = shuffled.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
        }
        return shuffled.slice(0, n);
      }

      const selectedCards = pickCards(cardPool, 4);
      const grid = document.getElementById('cardGrid');
      grid.innerHTML = '';
      selectedCards.forEach(card => {
        const cardDiv = document.createElement('div');
        cardDiv.className = 'card';
        cardDiv.innerHTML = `
          <span class="card-icon">${card.icon}</span>
          <div class="card-title">${card.title}</div>
          <div class="card-desc">${card.desc}</div>
        `;
        grid.appendChild(cardDiv);
      });

      // ----- 4. 随机标签云 -----
      const tagPool = [
        '🌱 极简', '✨ 随机', '📐 留白', '🧘 当下',
        '🌿 呼吸', '☕ 慢', '📖 静', '🎧 音',
        '🖌️ 线', '📦 序', '🕯️ 暖', '🌟 光',
        '🍃 风', '🌊 潮', '☀️ 晴', '🌙 夜',
        '🧩 碎片', '📷 瞬', '🎨 色', '🧶 织'
      ];
      // 随机选5~7个
      const tagCount = random(5, 7);
      const shuffledTags = [...tagPool].sort(() => Math.random() - 0.5);
      const selectedTags = shuffledTags.slice(0, tagCount);

      const tagContainer = document.getElementById('tagContainer');
      tagContainer.innerHTML = '';
      // 加入一个小 emoji 前缀
      const emojiPrefix = pick(['✦', '·', '◦', '▸', '▪']);
      const prefixSpan = document.createElement('span');
      prefixSpan.className = 'emoji-badge';
      prefixSpan.textContent = emojiPrefix;
      tagContainer.appendChild(prefixSpan);

      selectedTags.forEach(tag => {
        const span = document.createElement('span');
        span.textContent = tag;
        tagContainer.appendChild(span);
      });

      // 再随机加一个小尾巴
      const suffix = pick(['⚡', '∞', '~', '⏳', '⎔']);
      const suffixSpan = document.createElement('span');
      suffixSpan.className = 'emoji-badge';
      suffixSpan.textContent = suffix;
      tagContainer.appendChild(suffixSpan);

      // ----- 5. 随机脚注 (小彩蛋) -----
      const footerTexts = [
        '✦ 随机刷新 · 极简主页 ✦',
        '· 今日份 · 随机生成 ·',
        '◦ 保持简洁 · 保持好奇 ◦',
        '· 少即是多 · 极简即美 ·',
        '✦ 每一次刷新都是新的开始 ✦'
      ];
      document.getElementById('footerText').textContent = pick(footerTexts);

      // ----- 额外小细节: 刷新时卡片微动 (纯随机) -----
      // 给卡片添加一点随机的延迟动画 (仅视觉趣味)
      const cards = document.querySelectorAll('.card');
      cards.forEach((card, index) => {
        const delay = (Math.random() * 0.2).toFixed(2);
        card.style.transitionDelay = delay + 's';
        // 随机微边框色
        const borderHue = random(30, 60);
        card.style.borderColor = `hsl(${borderHue}, 12%, 88%)`;
      });

      // 随机改变 visual-shape 的 box-shadow 柔和度
      const shadowBlur = random(12, 30);
      shapeEl.style.boxShadow = `0 ${random(4, 12)}px ${shadowBlur}px rgba(0,0,0,0.02)`;

    })();
  </script>
</body>
</html>
